services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ecoplus
      POSTGRES_PASSWORD: ecoplus
      POSTGRES_DB: ecoplus_dev
    ports:
      - '5432:5432'
    volumes:
      - ecoplus-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecoplus -d ecoplus_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ecoplus:ecoplus@db:5432/ecoplus_dev
      JWT_ACCESS_SECRET: local-compose-secret-change-me-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: 30
      CORS_ORIGINS: http://localhost:8080
      THROTTLE_LIMIT: 120
      AUTH_THROTTLE_LIMIT: 10
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  ecoplus-db:
